name: knxip-fan-5speed
components:
  - label: main
    id: main
    capabilities:
      - id: switch
        version: 1
      - id: fanSpeed
        version: 1
      - id: refresh
        version: 1
      - id: statelessFanspeedButton
        version: 1
      - id: statelessSwitchLevelStep
        version: 1
    categories:
      - name: Fan
preferences:
  - name: cmdSwitch
    title: "Switch Set(1.001):Group Addr"
    required: true
    preferenceType: string
    definition:
      stringType: text
      default: ""
  - name: switch
    title: "Switch Status(1.001):Group Addr"
    required: true
    preferenceType: string
    definition:
      stringType: text
      default: ""

  - name: cmdLevel
    title: "Level Set(5.001):Group Addr"
    required: true
    preferenceType: string
    definition:
      stringType: text
      default: ""
  - name: level
    title: "Level Status(5.001):Group Addr"
    required: true
    preferenceType: string
    definition:
      stringType: text
      default: ""
deviceConfig:
  dashboard:
    states:
    - component: main
      capability: fanSpeed
      version: 1
      idx: 0
      group: main
      values:
      - label: '{{fanSpeed.value}}'
        alternatives:
        - key: '0'
          value: '{{i18n.attributes.fanSpeed.i18n.value.0.label}}'
          type: inactive
        - key: '1'
          value: "Level 1"
          type: active
        - key: '2'
          value: "Level 2"
          type: active
        - key: '3'
          value: "Level 3"
          type: active
        - key: '4'
          value: "Level 4"
          type: active
        - key: '5'
          value: "Level 5"
          type: active
    actions:
    - component: main
      capability: switch
      version: 1
      idx: 0
      group: main
  detailView:
  - component: main
    capability: switch
    version: 1
  - component: main
    capability: fanSpeed
    version: 1
    patch:
      - op: replace
        path: /0/slider/range
        value: [0, 5]
      - op: replace
        path: /0/slider/alternatives
        value:
          - key: '0'
            value: '{{i18n.attributes.fanSpeed.i18n.value.0.label}}'
            type: inactive
          - key: '1'
            value: "Level 1"
            type: active
          - key: '2'
            value: "Level 2"
            type: active
          - key: '3'
            value: "Level 3"
            type: active
          - key: '4'
            value: "Level 4"
            type: active
          - key: '5'
            value: "Level 5"
            type: active
  - component: main
    capability: refresh
    version: 1
  automation:
    conditions:
    - component: main
      capability: switch
      version: 1
    - component: main
      capability: fanSpeed
      version: 1
      patch:
        - op: replace
          path: /0/list/alternatives
          value:
            - key: '0'
              value: '{{i18n.attributes.fanSpeed.i18n.value.0.label}}'
              type: inactive
            - key: '1'
              value: "Level 1"
              type: active
            - key: '2'
              value: "Level 2"
              type: active
            - key: '3'
              value: "Level 3"
              type: active
            - key: '4'
              value: "Level 4"
              type: active
            - key: '5'
              value: "Level 5"
              type: active
    actions:
    - component: main
      capability: switch
      version: 1
    - component: main
      capability: fanSpeed
      version: 1
      patch:
        - op: replace
          path: /0/list/alternatives
          value:
            - key: '0'
              value: '{{i18n.commands.setFanSpeed.arguments.speed.i18n.0.label}}'
              type: inactive
            - key: '1'
              value: "Level 1"
              type: active
            - key: '2'
              value: "Level 2"
              type: active
            - key: '3'
              value: "Level 3"
              type: active
            - key: '4'
              value: "Level 4"
              type: active
            - key: '5'
              value: "Level 5"
              type: active
    - component: main
      capability: statelessFanspeedButton
      version: 1
    - component: main
      capability: statelessSwitchLevelStep
      version: 1
      patch:
        - op: replace
          path: /0/label
          value: "Fan Speed Percent Step"      
    - component: main
      capability: refresh
      version: 1
